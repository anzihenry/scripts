name: Release E2E Gate

# 发布前门禁：打 tag（v*）或手动触发时，在全新 macOS VM 上执行
#   L1 沙箱命令桩 E2E（tests/e2e/run_all.sh）
#   L2 真实 macOS 流程（release verify / 各 --dry-run / Formula 实装）
# 全部通过后，才允许执行 release publish。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

defaults:
  run:
    shell: /bin/zsh -euo pipefail {0}

jobs:
  e2e-gate:
    name: Pre-release E2E gate
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Full sandbox regression
        run: zsh tests/run_all.sh --report "$RUNNER_TEMP/release-validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-sandbox-validation
          path: ${{ runner.temp }}/release-validation-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Release verify (real gh, non-destructive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ./bin/macos-scripts release verify "$TAG"

      - name: Bootstrap install dry-run (real macOS)
        run: zsh bootstrap/install.sh --dry-run

      - name: Setup brew configure dry-run (real macOS)
        run: ./bin/macos-scripts setup brew configure --dry-run

      - name: Maintain brew dry-run (real macOS)
        run: ./bin/macos-scripts maintain brew --dry-run

      - name: Formula install (real end-to-end via tap)
        # 走真实用户路径：brew tap + brew install <tap>/macos-scripts。
        # 注意：brew tap 默认按 github.com/<user>/homebrew-<repo> 解析远端，
        # 本仓库名为 scripts 而非 homebrew-scripts，必须显式指定远端 URL。
        # 读取的是 tap 仓库 main 分支的 Formula（sha256 已在 main 回填），
        # 与 tag 内 Formula 解耦，避免 tag 冻结与 sha256 回填的循环依赖。
        run: |
          brew tap anzihenry/scripts https://github.com/anzihenry/scripts
          brew install anzihenry/scripts/macos-scripts 2>&1 | tail -30
          command -v macos-scripts
          macos-scripts --version
          macos-scripts help setup git
