name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: /bin/zsh -euo pipefail {0}

jobs:
  test:
    name: Shell checks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(vars.MACOS_TEST_RUNNERS || '["macos-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Runtime identity
        run: |
          sw_vers
          uname -m
          /bin/zsh --version

      - name: Bootstrap generated source check
        run: zsh lint/sync_bootstrap.sh --check

      - name: Zsh interpreter and syntax guard
        run: zsh tests/syntax_guard.sh

      - name: Zsh checks
        run: ./lint/lint_shell.sh

      - name: CLI smoke tests
        run: zsh tests/smoke_cli.sh

      - name: Guard tests (zsh)
        run: |
          for t in bootstrap_guard cli_dispatch_guard cli_validators_guard \
                   version_consistency_guard regression_guard zsh_migration_guard \
                   macos_installer_flow_guard release_publish_guard \
                   setup_runtime_guard maintain_runtime_guard idempotence_guard reliability_guard zsh_kit_guard template_guard reuse_acceptance_guard; do
            zsh "tests/${t}.sh"
          done

      - name: E2E tests (sandbox + command stubs)
        run: zsh tests/e2e/run_all.sh
