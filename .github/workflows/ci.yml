name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: /bin/zsh -euo pipefail {0}

jobs:
  test:
    name: Shell checks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(vars.MACOS_TEST_RUNNERS || '["macos-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Full sandbox regression
        run: zsh tests/run_all.sh --report "$RUNNER_TEMP/validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-${{ github.run_id }}-${{ github.run_attempt }}

  shell-checks:
    name: Shell checks (macOS)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every macOS matrix job to pass
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
